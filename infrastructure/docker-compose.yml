services:
  postgres:
    image: postgres:16-alpine
    container_name: techquery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-techquery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techquery_secret}
      POSTGRES_DB: ${DB_NAME:-techquery_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-techquery} -d ${DB_NAME:-techquery_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: techquery_postgres_data
